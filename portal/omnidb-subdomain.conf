# Apache configuration for OmniDB subdomain
# This file should be placed in /etc/apache2/sites-available/
# and enabled with: a2ensite omnidb-subdomain.conf

<VirtualHost *:80>
  ServerName omnidb.localhost
  # For production, replace with your actual domain:
  # ServerName omnidb.yourdomain.com

  RewriteEngine On
  RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
  ServerName omnidb.localhost
  # For production, replace with your actual domain:
  # ServerName omnidb.yourdomain.com

  SSLEngine on
  # IMPORTANT: For production, replace these with proper SSL certificates
  # Using self-signed certificates is only suitable for development/testing
  SSLCertificateFile   /etc/ssl/certs/ssl-cert-snakeoil.pem
  SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
  SSLProxyEngine On
  SSLProxyCheckPeerCN Off
  SSLProxyCheckPeerName Off

  ServerAdmin webmaster@localhost
  ErrorLog ${APACHE_LOG_DIR}/omnidb-error.log
  CustomLog ${APACHE_LOG_DIR}/omnidb-access.log combined

  # Authentication for OmniDB subdomain
  DefineExternalAuth pwauth pipe /usr/sbin/pwauth

  # Compression
  SetOutputFilter DEFLATE
  AddOutputFilterByType DEFLATE text/plain
  AddOutputFilterByType DEFLATE text/html
  AddOutputFilterByType DEFLATE text/xml
  AddOutputFilterByType DEFLATE text/css
  AddOutputFilterByType DEFLATE application/xml
  AddOutputFilterByType DEFLATE application/xhtml+xml
  AddOutputFilterByType DEFLATE application/rss+xml
  AddOutputFilterByType DEFLATE application/javascript
  AddOutputFilterByType DEFLATE application/x-javascript

  # OmniDB WSGI configuration - serving from root path
  <IfModule wsgi_module>
    WSGIDaemonProcess omnidb user=omnidb group=omnidb
    WSGIScriptAlias / /usr/share/elephant-shed/omnidb/wsgi.py process-group=omnidb
    Alias /static /usr/lib/python3/dist-packages/OmniDB_app/static
    <Directory /usr/share/elephant-shed/omnidb>
      <Files wsgi.py>
        Require all granted
      </Files>
    </Directory>
    <Directory /usr/lib/python3/dist-packages/OmniDB_app/static>
      Require all granted
    </Directory>
  </IfModule>

  # Require authentication for the entire subdomain
  <Location />
    AuthType Basic
    AuthName "Elephant Shed - OmniDB"
    AuthBasicProvider external
    AuthExternal pwauth
    Require unix-group elephant-shed
  </Location>
</VirtualHost>
